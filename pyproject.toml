[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keystroke-cadence-dynamics-verifier"
version = "1.0.0"
description = "Opt-in cadence check that scores dwell and flight timings with dynamic time warping. No characters are stored."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "TechieGoku2623" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["black==24.8.0", "flake8==7.1.1"]

[project.scripts]
keystroke-cadence-dynamics-verifier = "keystroke_cadence_dynamics_verifier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
